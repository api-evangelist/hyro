description: 'No .well-known document is served on any Airbud/Hyro host. airbud.io (the legacy domain) does not answer HTTPS
  at all. hyro.ai 301s every path to www.hyro.ai, where /.well-known/* returns a hard 404 (the negative control too) and non-well-known
