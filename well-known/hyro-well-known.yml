  oauth-protected-resource, api-catalog) — a client-side router catch-all, not a document — while .json paths and the .json
  negative control 404. status.hyro.ai (Atlassian Statuspage) serves a security.txt whose Canonical is atlassian.com — the
  vendor''s document, not Hyro''s. NO WellKnown or SecurityTxt pointer is emitted: nothing here is a hit.'
