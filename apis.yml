name: Hyro
description: >-
  Hyro is a responsible AI-powered conversational and agentic communications
  platform, best known for deploying AI assistants and voice/chat agents for
  large healthcare systems as well as other regulated enterprises. Its platform
  automates patient and customer engagement across web, SMS, and voice channels
  — handling tasks such as appointment management, IT help-desk requests, call
  routing, and answering high-volume repetitive questions — using a
  knowledge-graph-driven natural language engine positioned around
  explainability and control. Hyro is headquartered in New York and is backed by
  Norwest Venture Partners. At enrichment time Hyro exposes no public developer
  API or OpenAPI specification; its public technical surface consists of a
  customer product dashboard (docs.hyro.ai) and a live operational status page
  (status.hyro.ai). This profile was surfaced from the Norwest portfolio and
  enriched from verifiable public signals only.
